[package]
name = "blackcode-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
tokio-stream = "0.1"
anyhow = "1.0"
llama-cpp-2 = "0.1.66"
uuid = { version = "1.0", features = ["v4"] }
ndarray = "0.15"
diffy = "0.3"
encoding_rs = "0.8"
chrono = "0.4"
